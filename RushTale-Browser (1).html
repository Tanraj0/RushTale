const W = canvas.width, H = canvas.height;

const PIXEL_FONT = "'Press Start 2P', 'Courier New', monospace";
const BODY_FONT = "'Segoe UI', 'Helvetica Neue', Arial, sans-serif";

// ---- Characters (edit or add more here) ----
const CHARACTERS = [
  { name: 'Baller', sprite: 'baller', color: '#e02020', w: 20, h: 44, speed: 380, jump: 650 }
];
const cardX = i => (W - (CHARACTERS.length * 240 + (CHARACTERS.length - 1) * 40)) / 2 + i * 280;

// ---- Level (a grid of tiles) ----
const T = 30;                      // tile size in pixels; the screen shows 32 x 18 tiles
const ROWS = 18;
const MAX_COLS = 320;
const BAR = 52;                    // height of the editor toolbar
let camX = 0;                      // camera position (left edge of the screen, in world pixels)

// Tile codes. 1-4 are solid; everything else you walk through.
const EMPTY = 0, GRASS = 1, DIRT = 2, ROCK = 3, CAVE = 4, SPIKE = 5, WATER = 6, FINISH = 7, CHECK = 8, BRWLER = 9;
const LETTERS = '.#drc^~FCB';     // how each code is written in a saved level file
const PALETTE = [                  // [tool id, name, tile code]
  ['grass', 'Grass', GRASS], ['dirt', 'Dirt', DIRT], ['rock', 'Rock', ROCK], ['cave', 'Cave rock', CAVE],
  ['spike', 'Spike', SPIKE], ['water', 'Water', WATER], ['finish', 'Finish flag', FINISH],
  ['checkpoint', 'Checkpoint flag', CHECK], ['brwler', 'Brwler (enemy)', BRWLER],
  ['erase', 'Erase', 0], ['spawn', 'Spawn point', -1]
];
const TOOL_CODE = Object.fromEntries(PALETTE.map(p => [p[0], p[2]]));

let level = loadLevel();           // the saved level, or the starter level

function defaultLevel() {
  const cols = 96;
  const tiles = new Uint8Array(cols * ROWS);
  const put = (c, r, k) => { tiles[r * cols + c] = k; };
  for (let c = 0; c < cols; c++) for (let r = 16; r < ROWS; r++) put(c, r, GRASS);
  for (let c = 18; c < 21; c++) put(c, 15, GRASS);
  for (let c = 21; c < 24; c++) { put(c, 14, GRASS); put(c, 15, GRASS); }
  put(30, 15, SPIKE); put(31, 15, SPIKE);
  put(38, 15, BRWLER);
  for (let c = 46; c < 52; c++) { put(c, 16, WATER); put(c, 17, ROCK); }
  put(56, 15, CHECK);
  put(90, 15, FINISH);
  return { cols, rows: ROWS, tiles, spawn: { c: 2, r: 15 } };
}

function levelToJSON() {
  const map = [];
  for (let r = 0; r < ROWS; r++) {
    let row = '';
    for (let c = 0; c < level.cols; c++) row += LETTERS[level.tiles[r * level.cols + c]];
    map.push(row);
  }
  return JSON.stringify({ game: 'rush-tale', version: 1, cols: level.cols, rows: ROWS, spawn: level.spawn, map });
}

function levelFromJSON(text) {
  const d = JSON.parse(text);
  if (!d || !Array.isArray(d.map) || d.map.length !== ROWS || typeof d.map[0] !== 'string') return null;
  const cols = d.map[0].length;
  if (cols < 32 || cols > MAX_COLS) return null;
  const tiles = new Uint8Array(cols * ROWS);
  for (let r = 0; r < ROWS; r++) {
    const row = d.map[r];
    if (typeof row !== 'string' || row.length !== cols) return null;
    for (let c = 0; c < cols; c++) {
      const k = LETTERS.indexOf(row[c]);
      if (k < 0) return null;
      tiles[r * cols + c] = k;
    }
  }
  const sp = d.spawn || {};
  const ok = Number.isInteger(sp.c) && Number.isInteger(sp.r) && sp.c >= 0 && sp.c < cols && sp.r >= 0 && sp.r < ROWS;
  return { cols, rows: ROWS, tiles, spawn: ok ? { c: sp.c, r: sp.r } : { c: 2, r: 15 } };
}

function saveLevel() {
  try { localStorage.setItem('rushtale.level', levelToJSON()); } catch (e) {}
}
function loadLevel() {
  try {
    const text = localStorage.getItem('rushtale.level');
    return (text && levelFromJSON(text)) || defaultLevel();
  } catch (e) {
    return defaultLevel();
  }
}

const tileCode = (c, r) => (c >= 0 && c < level.cols && r >= 0 && r < ROWS) ? level.tiles[r * level.cols + c] : 0;
const isTile = (c, r) => { const k = tileCode(c, r); return k >= GRASS && k <= CAVE; };
function solid(c, r) {
  if (c < 0 || c >= level.cols) return true;     // the level's left and right edges are walls
  return isTile(c, r);
}
const clampCam = x => Math.max(0, Math.min(level.cols * T - W, x));
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

// Solid tiles that overlap a rectangle
function nearby(a) {
  const out = [];
  const c0 = Math.floor(a.x / T), c1 = Math.floor((a.x + a.w - 0.001) / T);
  const r0 = Math.floor(a.y / T), r1 = Math.floor((a.y + a.h - 0.001) / T);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (solid(c, r)) out.push({ x: c * T, y: r * T, w: T, h: T });
  }
  return out;
}

// ---- State ----
let screen = 'menu';        // 'menu' | 'select' | 'play' | 'win' | 'editor'
let selected = 0;
let buttons = [];           // clickable rects for the current screen
let hovered = null;
let tool = 'grass';         // editor brush (any id in PALETTE)
let painting = 0;           // 0 = not painting, 1 = drawing, 2 = erasing
let mouse = null;
let returnTo = 'menu';      // where Esc goes after playing
let notice = { text: '', until: 0 };
const notify = text => { notice = { text, until: performance.now() + 2200 }; };
let enemies = [];
let checkpoint = null;      // {c, r} of the last checkpoint flag touched
let flash = 0;              // red screen flash after getting hurt
let runTime = 0, winTime = 0;

// ---- Input ----
const keys = {};
const left  = () => keys.ArrowLeft  || keys.KeyA;
const right = () => keys.ArrowRight || keys.KeyD;
const jump  = () => keys.ArrowUp || keys.KeyW || keys.Space;

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (!e.repeat) onPress(e.code);
});
addEventListener('keyup', e => { keys[e.code] = false; });

function onPress(code) {
  const confirm = code === 'Enter' || code === 'Space';
  if (screen === 'menu') {
    if (confirm) startGame();
  } else if (screen === 'select') {
    if (code === 'ArrowLeft' || code === 'KeyA') selected = (selected + CHARACTERS.length - 1) % CHARACTERS.length;
    if (code === 'ArrowRight' || code === 'KeyD') selected = (selected + 1) % CHARACTERS.length;
    if (confirm || code === 'Escape') setScreen('menu');
  } else if (screen === 'play') {
    if (code === 'Escape') setScreen(returnTo);
  } else if (screen === 'win') {
    if (code === 'Enter') startGame(returnTo);
    if (code === 'Escape') setScreen(returnTo);
  } else if (screen === 'editor') {
    if (code === 'Escape') { saveLevel(); setScreen('menu'); }
  }
}

function mousePos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
const inside = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;

function paintAt(p, erase) {
  const c = Math.floor((p.x + camX) / T), r = Math.floor(p.y / T);
  if (c < 0 || c >= level.cols || r < 0 || r >= ROWS) return;
  const code = erase ? 0 : TOOL_CODE[tool];
  if (code < 0) return;                          // the spawn tool does not paint tiles
  level.tiles[r * level.cols + c] = code;
}
function stopPaint() {
  if (painting) { painting = 0; saveLevel(); }
}

canvas.addEventListener('mousemove', e => {
  mouse = mousePos(e);
  hovered = buttons.find(b => inside(mouse, b)) || null;
  canvas.style.cursor = hovered ? 'pointer' : (screen === 'editor' ? 'crosshair' : 'default');
  if (painting && mouse.y >= BAR) paintAt(mouse, painting === 2);
});
canvas.addEventListener('mouseleave', () => { mouse = null; hovered = null; stopPaint(); });
canvas.addEventListener('mousedown', e => {
  canvas.focus();
  if (screen !== 'editor') return;
  const p = mousePos(e);
  if (p.y < BAR || buttons.some(b => inside(p, b))) return;
  if (tool === 'spawn' && e.button === 0) {
    level.spawn = { c: Math.floor((p.x + camX) / T), r: Math.floor(p.y / T) };
    saveLevel();
    return;
  }
  painting = (e.button === 2 || tool === 'erase') ? 2 : 1;
  paintAt(p, painting === 2);
});
addEventListener('mouseup', stopPaint);
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  if (screen !== 'editor') return;
  e.preventDefault();
  camX = clampCam(camX + (e.deltaX || e.deltaY));
}, { passive: false });
canvas.addEventListener('click', e => {
  const b = buttons.find(b => inside(mousePos(e), b));
  if (b) b.action();
});

// ---- Editor actions ----
function widen() {
  if (level.cols + 16 > MAX_COLS) { notify('That is the longest level'); return; }
  const cols = level.cols + 16;
  const tiles = new Uint8Array(cols * ROWS);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < level.cols; c++) tiles[r * cols + c] = level.tiles[r * level.cols + c];
    if (r >= 16) for (let c = level.cols; c < cols; c++) tiles[r * cols + c] = GRASS;
  }
  level = { cols, rows: ROWS, tiles, spawn: level.spawn };
  saveLevel();
  notify('Level is now ' + cols + ' tiles wide');
}

function exportLevel() {
  const blob = new Blob([levelToJSON()], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'rush-tale-level.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  notify('Level exported');
}

function importLevel() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const loaded = levelFromJSON(reader.result);
        if (!loaded) throw new Error('bad level');
        level = loaded;
        camX = 0;
        saveLevel();
        notify('Level imported');
      } catch (err) {
        notify("Couldn't read that file");
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ---- Screens ----
function setScreen(name) {
  screen = name;
  hovered = null;
  painting = 0;
  canvas.style.cursor = 'default';
  if (name === 'menu') {
    buttons = [
      { x: W / 2 - 200, y: 217, w: 400, h: 64, label: 'Start', primary: true, size: 28, action: startGame },
      { x: W / 2 - 200, y: 297, w: 400, h: 64, label: 'Select Character', primary: true, size: 20, action: () => setScreen('select') },
      { x: W / 2 - 200, y: 377, w: 400, h: 64, label: 'Level Editor', primary: true, size: 20, action: () => { camX = 0; setScreen('editor'); } }
    ];
  } else if (name === 'select') {
    buttons = CHARACTERS.map((c, i) => ({
      x: cardX(i), y: 110, w: 240, h: 240, card: true, action: () => { selected = i; }
    }));
    buttons.push({ x: 30, y: 30, w: 140, h: 48, label: 'Back', size: 16, action: () => setScreen('menu') });
    buttons.push({ x: W / 2 - 120, y: 390, w: 240, h: 64, label: 'Select', primary: true, size: 26, action: () => setScreen('menu') });
  } else if (name === 'win') {
    buttons = [
      { x: W / 2 - 200, y: 270, w: 400, h: 64, label: 'Play Again', primary: true, size: 24, action: () => startGame(returnTo) },
      { x: W / 2 - 200, y: 350, w: 400, h: 64, label: returnTo === 'editor' ? 'Back to Editor' : 'Menu', primary: true, size: 20, action: () => setScreen(returnTo) }
    ];
  } else if (name === 'editor') {
    buttons = [];
    let x = 10;
    for (const [id] of PALETTE) {
      buttons.push({ x, y: 8, w: 36, h: 36, swatch: true, tool: id, action: () => { tool = id; } });
      x += 40;
    }
    x += 14;
    const items = [
      ['Test', () => { saveLevel(); startGame('editor'); }],
      ['Wider', widen],
      ['Export', exportLevel],
      ['Import', importLevel],
      ['Menu', () => { saveLevel(); setScreen('menu'); }]
    ];
    for (const [label, action] of items) {
      const w = label.length * 12 + 28;
      buttons.push({ x, y: 6, w, h: 40, label, size: 12, color: label === 'Test' ? '#8ee07a' : null, action });
      x += w + 8;
    }
  } else {
    buttons = [];
  }
}

// ---- Game world ----
const GRAVITY = 1800;
let player = null;

function makeEnemies() {
  const list = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < level.cols; c++) {
    if (tileCode(c, r) === BRWLER) {
      list.push({ x: c * T + 2, y: (r + 1) * T - 26, w: 26, h: 26, dir: -1, vy: 0, onGround: false, dead: false, deadT: 0, t: 0 });
    }
  }
  return list;
}

function startGame(from) {
  returnTo = from === 'editor' ? 'editor' : 'menu';
  const c = CHARACTERS[selected];
  player = { ...c, vx: 0, vy: 0, onGround: false, face: 1, phase: 0, t: 0 };
  enemies = makeEnemies();
  checkpoint = null;
  runTime = 0;
  flash = 0;
  spawnPlayer();
  setScreen('play');
}

function spawnPlayer() {
  const sp = checkpoint || level.spawn;           // restart from the last checkpoint flag
  player.x = sp.c * T + (T - player.w) / 2;
  player.y = (sp.r + 1) * T - player.h;
  player.vx = 0;
  player.vy = 0;
  let guard = 0;
  while (nearby(player).length && guard++ < 20) player.y -= T;   // lift out of tiles if the spawn is buried
  camX = clampCam(player.x + player.w / 2 - W / 2);
}

function die() {
  flash = 0.35;
  spawnPlayer();
}

function updateEnemy(e, dt) {
  e.t += dt;
  if (e.dead) { e.deadT += dt; return; }
  e.vy += GRAVITY * dt;
  const dirX = e.dir;
  e.x += dirX * 55 * dt;
  const side = nearby(e);
  if (side.length) { e.x = dirX > 0 ? side[0].x - e.w : side[0].x + side[0].w; e.dir = -dirX; }
  e.y += e.vy * dt;
  e.onGround = false;
  const down = nearby(e);
  if (down.length) { if (e.vy > 0) { e.y = down[0].y - e.h; e.onGround = true; } e.vy = 0; }
  if (e.onGround) {                                // turn around at ledges
    const fx = e.dir > 0 ? e.x + e.w + 2 : e.x - 2;
    if (!solid(Math.floor(fx / T), Math.floor((e.y + e.h + 2) / T))) e.dir = -e.dir;
  }
  if (e.y > ROWS * T + 100) { e.dead = true; e.deadT = 1; }
}

function update(dt) {
  if (screen === 'editor') {
    const d = (right() ? 1 : 0) - (left() ? 1 : 0);
    if (d) camX = clampCam(camX + d * 700 * dt);
    return;
  }
  if (screen !== 'play') return;
  runTime += dt;
  flash = Math.max(0, flash - dt);

  const inWater = tileCode(Math.floor((player.x + player.w / 2) / T), Math.floor((player.y + player.h * 0.6) / T)) === WATER;
  const maxSpeed = player.speed * (inWater ? 0.55 : 1);

  const dir = (right() ? 1 : 0) - (left() ? 1 : 0);
  if (dir !== 0) {
    // speed builds up the longer you hold a direction; turning around is quick
    const accel = (player.vx === 0 || Math.sign(player.vx) === dir) ? 450 : 1600;
    player.vx = Math.max(-maxSpeed, Math.min(maxSpeed, player.vx + dir * accel * dt));
    player.face = dir;
  } else {
    const slow = (player.onGround ? 1400 : 300) * dt;
    player.vx = Math.abs(player.vx) <= slow ? 0 : player.vx - Math.sign(player.vx) * slow;
  }
  if (jump() && player.onGround) { player.vy = -player.jump; player.onGround = false; }
  else if (jump() && inWater) player.vy = Math.max(player.vy - 2600 * dt, -240);   // swim up
  player.vy += (inWater ? GRAVITY * 0.28 : GRAVITY) * dt;
  if (inWater) {                                  // water drag: fast falls ease down to a slow sink
    if (player.vy > 160) player.vy += (160 - player.vy) * Math.min(1, dt * 12);
    player.vy = Math.max(-240, player.vy);
  }

  const moveX = Math.sign(player.vx);
  player.x += player.vx * dt;
  const sideHits = nearby(player);
  for (const p of sideHits) player.x = moveX > 0 ? p.x - player.w : p.x + p.w;
  if (sideHits.length) player.vx = 0;

  const moveY = Math.sign(player.vy);
  player.y += player.vy * dt;
  player.onGround = false;
  const vertHits = nearby(player);
  for (const p of vertHits) {
    if (moveY > 0) { player.y = p.y - player.h; player.onGround = true; }
    else player.y = p.y + p.h;
  }
  if (vertHits.length) player.vy = 0;

  player.x = Math.max(0, Math.min(level.cols * T - player.w, player.x));
  if (player.y > ROWS * T + 200) { die(); return; }

  const target = clampCam(player.x + player.w / 2 - W / 2);
  camX += (target - camX) * Math.min(1, dt * 8);
  player.t += dt;
  if (player.onGround && Math.abs(player.vx) > 5) player.phase += dt * (7 + Math.abs(player.vx) * 0.03);   // walk / sprint cycle

  // spikes hurt, flags do their thing
  const c0 = Math.floor(player.x / T), c1 = Math.floor((player.x + player.w - 0.001) / T);
  const r0 = Math.floor(player.y / T), r1 = Math.floor((player.y + player.h - 0.001) / T);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const k = tileCode(c, r);
    if (k === SPIKE && overlap(player, { x: c * T + 4, y: r * T + 12, w: T - 8, h: T - 12 })) { die(); return; }
    if (k === CHECK) checkpoint = { c, r };
    if (k === FINISH) { winTime = runTime; setScreen('win'); return; }
  }

  // Brwlers: jump on their heads to squash them, touch them any other way and you get hurt
  for (const e of enemies) {
    updateEnemy(e, dt);
    if (e.dead || !overlap(player, e)) continue;
    if (player.vy > 100 && player.y + player.h - e.y < 16) {
      e.dead = true; e.deadT = 0;
      player.vy = -430; player.onGround = false;
    } else { die(); return; }
  }
  enemies = enemies.filter(e => !(e.dead && e.deadT > 0.5));
}

// ---- Drawing ----
function drawBall(cx, cy, r) {
  const g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.1, cx, cy, r);
  g.addColorStop(0, '#ff7a7a'); g.addColorStop(1, '#a50f0f');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.stroke();
}

// Side-view 2D character made of 6 flat parts: head, torso, 2 arms, 2 legs.
// pose: { speed, air, phase, t }
function drawBaller(c, x, y, scale, face, pose = {}) {
  const SKIN = '#f5e61b', SKIN_DARK = '#d4c600', RED = '#e02020';
  const PANTS = '#1d2433', PANTS_DARK = '#141a28', INK = '#1b1b1b';
  const lerp = (a, b, t) => a + (b - a) * t;
  const speed = pose.speed || 0;
  const move = Math.min(1, speed / 60);                           // 0 standing .. 1 moving
  const sprint = Math.max(0, Math.min(1, (speed - 180) / 120));   // 0 walking .. 1 full sprint
  const sn = Math.sin(pose.phase || 0);
  const LEG = 16, ARM = 14;

  // Angles as [near, far]. Positive swings toward the way he is facing.
  let leg, arm, lean;
  if (pose.air) {
    const sway = Math.sin((pose.t || 0) * 12) * 0.1;
    leg = [0.7, -0.5];
    arm = [-2.1 + sway, -1.8 - sway];                             // arms up and trailing behind
    lean = 0.08 + sprint * 0.2;
  } else {
    const A = lerp(0.55, 0.9, sprint) * move;                     // leg swing
    const AA = lerp(0.5, 1.0, sprint) * move;                     // arm swing
    leg = [A * sn, -A * sn];
    arm = [-AA * sn, AA * sn];
    lean = lerp(0.04, 0.38, sprint) * move;
  }
  const breathe = (pose.air || move > 0) ? 0 : Math.sin((pose.t || 0) * 2.5) * 0.35;
  const hipY = -(pose.air ? LEG : Math.max(LEG * Math.cos(leg[0]), LEG * Math.cos(leg[1])));  // lowest foot stays on the ground

  // One solid limb, hinged at its rounded top end
  const limb = (px, py, a, len, w, fill) => {
    ctx.save();
    ctx.translate(px, py); ctx.rotate(-a);
    ctx.fillStyle = fill;
    ctx.fillRect(-w / 2, 0, w, len);
    ctx.beginPath(); ctx.arc(0, 0, w / 2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  };
  const upper = fn => { ctx.save(); ctx.translate(0, -breathe); ctx.rotate(lean); fn(); ctx.restore(); };

  ctx.save();
  ctx.translate(x + c.w * scale / 2, y + c.h * scale);            // bottom centre of the hitbox
  ctx.scale(face > 0 ? scale : -scale, scale);
  ctx.translate(0, hipY);                                         // origin is now the hip

  upper(() => limb(0, -13, arm[1], ARM, 5, SKIN_DARK));           // far arm
  limb(0, -1, leg[1], LEG, 6, PANTS_DARK);                        // far leg
  limb(0, -1, leg[0], LEG, 6, PANTS);                             // near leg

  upper(() => {
    ctx.fillStyle = RED; ctx.fillRect(-5, -16, 10, 16);           // torso
    ctx.fillStyle = SKIN;                                         // head
    ctx.beginPath();
    ctx.moveTo(-3.5, -28); ctx.arcTo(6, -28, 6, -16, 2.5); ctx.arcTo(6, -16, -6, -16, 2.5);
    ctx.arcTo(-6, -16, -6, -28, 2.5); ctx.arcTo(-6, -28, 6, -28, 2.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = INK; ctx.fillRect(2.6, -23.6, 1.8, 2.6);      // eye
    ctx.fillRect(1.8, -19.4, 3.6, 1);                             // mouth
  });

  upper(() => limb(0, -13, arm[0], ARM, 5, SKIN));                // near arm
  ctx.restore();
}

function drawChar(c, x, y, scale = 1, face = 1, pose) {
  if (c.sprite === 'baller') return drawBaller(c, x, y, scale, face, pose);
  ctx.fillStyle = c.color;
  ctx.fillRect(x, y, c.w * scale, c.h * scale);
}

function text(str, x, y, size, color, font = BODY_FONT, align = 'center') {
  ctx.font = `${size}px ${font}`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
}

// Pixel text with a small black outline
function outlined(str, x, y, size, fill, line = 6) {
  ctx.font = `${size}px ${PIXEL_FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = line;
  ctx.strokeStyle = '#000';
  ctx.strokeText(str, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(str, x, y);
}

function drawButton(b) {
  if (b.card) return;
  if (b.swatch) return drawSwatch(b);
  const hot = hovered === b;
  const lit = b.primary || (b.tool && b.tool === tool);
  if (b.color) ctx.fillStyle = hot ? '#a8f095' : b.color;
  else if (lit) ctx.fillStyle = hot ? '#ffe45c' : '#ffd23f';
  else ctx.fillStyle = hot ? '#e3e8f3' : '#cfd6e6';
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
  ctx.strokeRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4);
  outlined(b.label.toUpperCase(), b.x + b.w / 2, b.y + b.h / 2 + 2, b.size || 26, '#fff', Math.max(2, Math.round((b.size || 26) / 6)));
}

const tileHash = (c, r) => (Math.imul(c * 73856093 ^ r * 19349663, 2654435761) >>> 0);

function drawWaterTile(x, y, surface, time) {
  ctx.fillStyle = 'rgba(40, 120, 220, 0.5)';
  ctx.fillRect(x, y, T, T);
  if (surface) {
    ctx.fillStyle = 'rgba(200, 235, 255, 0.9)';
    for (let k = 0; k < T; k += 5) ctx.fillRect(x + k, y + 1 + Math.sin((x + k) * 0.25 + time * 3) * 1.5, 5, 3);
  }
}

// Brwler: a grumpy purple brute. (x, y) is the top-left of its 26 x 26 hitbox.
function drawBrwler(x, y, dir, t, dead) {
  ctx.save();
  ctx.translate(x + 13, y + 26);
  ctx.scale(dir > 0 ? 1 : -1, dead ? 0.3 : 1);
  const step = dead ? 0 : Math.sin(t * 12);
  ctx.fillStyle = '#2a1a3d';                                                   // feet
  ctx.fillRect(-10, -4 - Math.max(0, step) * 3, 8, 4);
  ctx.fillRect(2, -4 - Math.max(0, -step) * 3, 8, 4);
  ctx.fillStyle = '#7b4bb5'; ctx.fillRect(-13, -24, 26, 20);                   // body
  ctx.fillStyle = '#5c3590'; ctx.fillRect(-13, -7, 26, 3);
  ctx.fillStyle = '#f08a2c';                                                   // fists
  ctx.beginPath(); ctx.arc(-14, -12, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(14, -12, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(-9, -20, 7, 6); ctx.fillRect(2, -20, 7, 6);   // eyes
  ctx.fillStyle = '#111'; ctx.fillRect(-5, -18, 3, 4); ctx.fillRect(6, -18, 3, 4);
  ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.lineCap = 'round';          // angry brows
  ctx.beginPath(); ctx.moveTo(-10, -24); ctx.lineTo(-2, -20.5); ctx.moveTo(10, -24); ctx.lineTo(2, -20.5); ctx.stroke();
  ctx.fillStyle = '#111'; ctx.fillRect(-6, -11, 12, 3);                        // mouth with fangs
  ctx.fillStyle = '#fff'; ctx.fillRect(-5, -11, 3, 2); ctx.fillRect(2, -11, 3, 2);
  ctx.restore();
}

// One tile at (x, y). o: { grassTop, active }
function drawTileArt(code, x, y, h, o = {}) {
  if (code === GRASS || code === DIRT) {
    ctx.fillStyle = '#8a5a34';
    ctx.fillRect(x, y, T, T);
    ctx.fillStyle = '#6f4527';
    if (h % 3 === 0) ctx.fillRect(x + 4 + (h >>> 4) % 14, y + 12 + (h >>> 9) % 10, 6, 4);
    if (h % 5 === 1) ctx.fillRect(x + 4 + (h >>> 7) % 16, y + 6 + (h >>> 12) % 8, 4, 4);
    if (code === GRASS && o.grassTop) {
      ctx.fillStyle = '#58b947';
      ctx.fillRect(x, y, T, 10);
      ctx.fillStyle = '#3f8f35';
      ctx.fillRect(x, y + 6, T, 4);
      if (h % 2 === 0) ctx.fillRect(x + (h >>> 5) % 20, y + 10, 8, 4);
      ctx.fillStyle = '#7fd86a';
      ctx.fillRect(x + 2 + (h >>> 3) % 16, y + 2, 4, 4);
    }
  } else if (code === ROCK) {
    ctx.fillStyle = '#8b9099';
    ctx.fillRect(x, y, T, T);
    ctx.fillStyle = '#a9afb8';
    ctx.fillRect(x + 3 + (h >>> 3) % 12, y + 3 + (h >>> 8) % 6, 10, 4);
    ctx.fillRect(x + 4 + (h >>> 5) % 12, y + 18 + (h >>> 11) % 6, 9, 4);
    ctx.fillStyle = '#6a7079';
    ctx.fillRect(x, y + 14, T, 2);                                  // stone seams
    ctx.fillRect(x + (h % 2 ? 10 : 20), y, 2, 14);
    ctx.fillRect(x + (h % 2 ? 20 : 10), y + 16, 2, 14);
  } else if (code === CAVE) {
    ctx.fillStyle = '#3b2a36';
    ctx.fillRect(x, y, T, T);
    ctx.fillStyle = '#523a4d';
    ctx.fillRect(x + (h >>> 3) % 22, y + (h >>> 8) % 22, 5, 4);
    ctx.fillRect(x + (h >>> 6) % 22, y + (h >>> 11) % 22, 4, 4);
    ctx.fillStyle = '#2a1d27';
    ctx.fillRect(x + (h >>> 4) % 20, y + (h >>> 9) % 20, 7, 5);
  } else if (code === SPIKE) {
    ctx.fillStyle = '#5b6272';
    ctx.fillRect(x, y + 26, T, 4);
    for (let i = 0; i < 3; i++) {
      const bx = x + i * 10;
      ctx.fillStyle = '#d5dbe6';
      ctx.beginPath(); ctx.moveTo(bx, y + 26); ctx.lineTo(bx + 5, y + 8); ctx.lineTo(bx + 10, y + 26); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#9aa3b5';
      ctx.beginPath(); ctx.moveTo(bx + 5, y + 8); ctx.lineTo(bx + 10, y + 26); ctx.lineTo(bx + 5, y + 26); ctx.closePath(); ctx.fill();
    }
  } else if (code === FINISH || code === CHECK) {
    ctx.fillStyle = '#8b9099'; ctx.fillRect(x + 3, y + T - 4, 9, 4);   // base
    ctx.fillStyle = '#6b4b2a'; ctx.fillRect(x + 6, y + 2, 3, T - 4);   // pole
    ctx.fillStyle = '#e0b92e'; ctx.fillRect(x + 5, y, 5, 4);           // knob
    if (code === FINISH) {
      for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) {
        ctx.fillStyle = (i + j) % 2 ? '#ffffff' : '#111111';
        ctx.fillRect(x + 9 + i * 5, y + 4 + j * 5, 5, 5);
      }
    } else {
      const up = !!o.active;
      const fy = up ? y + 4 : y + 15;
      const wave = up ? Math.sin(performance.now() / 180) * 1.5 : 0;
      ctx.fillStyle = up ? '#3fb950' : '#b7bcc7';
      ctx.beginPath(); ctx.moveTo(x + 9, fy); ctx.lineTo(x + 24, fy + 6 + wave); ctx.lineTo(x + 9, fy + 12); ctx.closePath(); ctx.fill();
    }
  } else if (code === BRWLER) {
    drawBrwler(x + 2, y + T - 26, 1, 0, false);
  }
}

function drawSwatch(b) {
  const on = tool === b.tool, hot = hovered === b;
  ctx.fillStyle = on ? '#ffd23f' : (hot ? '#e3e8f3' : '#cfd6e6');
  ctx.fillRect(b.x, b.y, b.w, b.h);
  const x = b.x + 3, y = b.y + 3, code = TOOL_CODE[b.tool];
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, T, T); ctx.clip();
  if (code > 0) {
    if (code > CAVE) { ctx.fillStyle = '#8fd3ff'; ctx.fillRect(x, y, T, T); }
    if (code === WATER) drawWaterTile(x, y, true, 0);
    else drawTileArt(code, x, y, 7, { grassTop: true });
  } else if (b.tool === 'erase') {
    ctx.fillStyle = '#f1f1f1'; ctx.fillRect(x, y, T, T);
    ctx.strokeStyle = '#e02020'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x + 7, y + 7); ctx.lineTo(x + 23, y + 23); ctx.moveTo(x + 23, y + 7); ctx.lineTo(x + 7, y + 23); ctx.stroke();
  } else {
    ctx.fillStyle = '#8fd3ff'; ctx.fillRect(x, y, T, T);
    drawChar(CHARACTERS[selected], x + (T - 13) / 2, y + 1, 0.65, 1, {});
  }
  ctx.restore();
  ctx.strokeStyle = '#000'; ctx.lineWidth = on ? 4 : 2;
  ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
}

function drawWorld(showMarkers) {
  ctx.fillStyle = '#8fd3ff';
  ctx.fillRect(0, 0, W, H);
  const c0 = Math.max(0, Math.floor(camX / T)), c1 = Math.min(level.cols - 1, Math.floor((camX + W) / T));
  const playing = screen === 'play' || screen === 'win';
  ctx.save();
  ctx.translate(-Math.round(camX), 0);
  for (let r = 0; r < ROWS; r++) for (let c = c0; c <= c1; c++) {
    const code = level.tiles[r * level.cols + c];
    if (!code || code === WATER || (code === BRWLER && !showMarkers)) continue;
    drawTileArt(code, c * T, r * T, tileHash(c, r), {
      grassTop: !isTile(c, r - 1),
      active: playing && checkpoint && checkpoint.c === c && checkpoint.r === r
    });
  }
  ctx.restore();
}

// Water is drawn after the characters so you can see them through it
function drawWater() {
  const c0 = Math.max(0, Math.floor(camX / T)), c1 = Math.min(level.cols - 1, Math.floor((camX + W) / T));
  const time = performance.now() / 1000;
  ctx.save();
  ctx.translate(-Math.round(camX), 0);
  for (let r = 0; r < ROWS; r++) for (let c = c0; c <= c1; c++) {
    if (tileCode(c, r) === WATER) drawWaterTile(c * T, r * T, tileCode(c, r - 1) !== WATER, time);
  }
  ctx.restore();
}

function drawMenu() {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);
  outlined('RUSH TALE', W / 2, 132, 64, '#e02020', 6);
  buttons.forEach(drawButton);
}

function drawSelect() {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);
  outlined('SELECT CHARACTER', W / 2, 60, 30, '#e02020', 6);

  buttons.filter(b => b.card).forEach((b, i) => {
    const c = CHARACTERS[i], on = selected === i;
    ctx.fillStyle = on ? '#fff2a8' : '#f1f1f1';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#000'; ctx.lineWidth = on ? 6 : 3;
    ctx.strokeRect(b.x + 3, b.y + 3, b.w - 6, b.h - 6);
    drawBall(b.x + b.w / 2, b.y + 100, 52);
    outlined(c.name.toUpperCase(), b.x + b.w / 2, b.y + 195, 20, '#fff', 5);
  });

  buttons.filter(b => !b.card).forEach(drawButton);
}

function drawScene() {
  drawWorld(false);
  for (const e of enemies) drawBrwler(Math.round(e.x - camX), Math.round(e.y), e.dir, e.t, e.dead);
  const pose = { speed: Math.abs(player.vx), air: !player.onGround, phase: player.phase, t: player.t };
  drawChar(player, Math.round(player.x - camX), player.y, 1, player.face, pose);
  drawWater();
}

function drawPlay() {
  drawScene();
  if (flash > 0) {
    ctx.fillStyle = 'rgba(224, 32, 32, ' + Math.min(0.5, flash * 1.5) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  text(returnTo === 'editor' ? 'Esc: back to editor' : 'Esc: menu', 20, 24, 14, '#1b2233', BODY_FONT, 'left');
}

function drawWin() {
  drawScene();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
  ctx.fillRect(0, 0, W, H);
  outlined('LEVEL COMPLETE!', W / 2, 150, 44, '#e02020', 6);
  outlined('TIME ' + winTime.toFixed(1) + 'S', W / 2, 220, 24, '#fff', 5);
  buttons.forEach(drawButton);
}

function drawEditor() {
  drawWorld(true);
  drawWater();

  ctx.strokeStyle = 'rgba(0, 0, 0, 0.12)';                       // grid
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = -(camX % T); x <= W; x += T) { ctx.moveTo(Math.round(x) + 0.5, BAR); ctx.lineTo(Math.round(x) + 0.5, H); }
  for (let y = 0; y <= H; y += T) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
  ctx.stroke();

  const ch = CHARACTERS[selected];                                // spawn marker
  const sx = level.spawn.c * T - camX, sy = level.spawn.r * T;
  ctx.globalAlpha = 0.75;
  drawChar(ch, Math.round(sx + (T - ch.w) / 2), sy + T - ch.h, 1, 1, {});
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#e02020'; ctx.lineWidth = 2;
  ctx.strokeRect(sx + 1, sy + 1, T - 2, T - 2);

  if (mouse && mouse.y >= BAR && !hovered) {                      // cell under the cursor
    const c = Math.floor((mouse.x + camX) / T), r = Math.floor(mouse.y / T);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.strokeRect(c * T - camX + 1, r * T + 1, T - 2, T - 2);
  }

  ctx.fillStyle = '#ffffff';                                      // toolbar
  ctx.fillRect(0, 0, W, BAR);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, BAR - 3, W, 3);
  buttons.forEach(drawButton);
  const over = hovered && hovered.swatch;
  const name = PALETTE.find(p => p[0] === (over ? hovered.tool : tool))[1];
  text((over ? 'Pick: ' : 'Brush: ') + name + '.   Left-click paints, right-click erases. Left/Right keys or scroll to look around.',
       12, BAR + 20, 14, '#1b2233', BODY_FONT, 'left');
}

function draw() {
  if (screen === 'menu') drawMenu();
  else if (screen === 'select') drawSelect();
  else if (screen === 'editor') drawEditor();
  else if (screen === 'win') drawWin();
  else drawPlay();
  if (performance.now() < notice.until) outlined(notice.text, W / 2, H - 36, 16, '#fff', 4);
}

// ---- Loop (fixed timestep) ----
let last = performance.now(), acc = 0;
const STEP = 1 / 120;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000);
  last = now;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}

document.fonts.load('16px "Press Start 2P"');
setScreen('menu');
requestAnimationFrame(frame);

</script>
</body>
</html>
